name: CI

on:
    push:
        branches:
            - main
    pull_request:


jobs:
    test:
        runs-on: ubuntu-latest
    
        steps:
            # 1. Download your repository
            - name: Checkout repository
              uses: actions/checkout@v4
            
            # 2. Install Python
            - name: Setup Python
              uses: actions/setup-python@v5
              with: 
                python-version: "3.13"

            # 3. Cache installed packages (speeds up future runs)
            - name: Cache pip
              uses: actions/cache@v4
              with:
                path: ~/.cache/pip
                key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
                restore-keys: |
                    ${{ runner.os }}-pip-
            
            # 4. Install dependencies
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

            # 5. Create environment variables required by the app
            - name: Create .env
              run: |
                echo "DATABASE_URL=sqlite:///./test.db" >> .env
                echo "SECRET_KEY=test-secret-key" >> .env
                echo "REDIS_URL=redis://localhost:6379" >> .env
                echo "ADMIN_EMAIL=admin@test.com" >> .env
                echo "ADMIN_PASSWORD=password123" >> .env
                    
            # 6. Check formatting
            - name: Check formatting
              run: black --check .

            # 7. Run Ruff
            - name: Lint
              run: ruff check .
            
            # 8. Run tests
            - name: Run tests
              run: python -m pytest